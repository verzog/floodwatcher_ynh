#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "floodwatcher"
name = "Flood Watcher"
description.en = "Community flood dashboard for the Brisbane River catchment: river levels, rain, warnings and alerts"

version = "0.19.36~ynh1"

maintainers = ["verzog"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/verzog/floodwatcher"

[integration]
yunohost = ">= 12.0.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "300M"
ram.build = "50M"
ram.runtime = "150M"

[install]
    [install.domain]
    # No path question: the dashboard is installed at the top of a domain (or subdomain) of its
    # own, as the notification helper and the "add to home screen" settings expect.
    type = "domain"

    [install.init_main_permission]
    # A public site: anyone can read it, no accounts.
    type = "group"
    default = "visitors"

[resources]
    [resources.system_user]

    [resources.install_dir]
    # The web server reads the page files; nobody else needs to.
    group = "www-data:rx"

    [resources.data_dir]
    # var: private (state, push keys, history downloads). public: the dashboard's data files.
    subdirs = ["var", "public"]
    group = "www-data:rx"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "mariadb-server",
        "php8.3-fpm",
        "php8.3-cli",
        "php8.3-mysql",
        "php8.3-curl",
        "php8.3-mbstring",
        "php8.3-xml",
    ]

    [resources.database]
    type = "mysql"

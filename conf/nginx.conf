#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    # The page files (index.html, app.js, push.php, ...).
    alias __INSTALL_DIR__/www/;
    index index.html;

    # The dashboard's data files, rewritten every few minutes by the collectors. They live in the
    # data folder so upgrades never touch them.
    location __PATH__/data/ {
        alias __DATA_DIR__/public/;
        more_set_headers "Cache-Control: no-cache";
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }

    # Nothing hidden (such as .htaccess) is ever served.
    location ~ /\. {
        deny all;
    }
}
